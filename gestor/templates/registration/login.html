<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión | Panel CM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', }</script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-200 transition-colors duration-300 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white dark:bg-slate-800 p-8 md:p-12 rounded-3xl shadow-xl border border-slate-100 dark:border-slate-700 w-full max-w-md text-center">
        
        <div class="mb-8">
            <span class="bg-indigo-100 text-indigo-700 dark:bg-indigo-900/50 dark:text-indigo-300 text-sm font-bold py-1.5 px-4 rounded-full border border-indigo-200 dark:border-indigo-800">
                Gestor de Redes
            </span>
            <h2 class="text-3xl font-bold mt-6 text-slate-800 dark:text-slate-100">Bienvenido</h2>
            <p class="text-slate-500 dark:text-slate-400 mt-2 text-sm">Ingresá tus credenciales para continuar</p>
        </div>
        
        <form method="POST" action="" class="text-left space-y-5">
            {% csrf_token %}
            
            <div>
                <label class="block text-sm font-bold text-slate-600 dark:text-slate-300 mb-2">Usuario</label>
                <input type="text" name="username" required class="w-full px-4 py-3 border border-slate-300 dark:border-slate-600 rounded-xl bg-slate-50 dark:bg-slate-700/50 focus:ring-2 focus:ring-indigo-500 transition-colors outline-none">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-600 dark:text-slate-300 mb-2">Contraseña</label>
                <input type="password" name="password" required class="w-full px-4 py-3 border border-slate-300 dark:border-slate-600 rounded-xl bg-slate-50 dark:bg-slate-700/50 focus:ring-2 focus:ring-indigo-500 transition-colors outline-none">
            </div>

            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl hover:bg-indigo-700 transition-colors shadow-lg hover:shadow-indigo-500/30 mt-4">
                Ingresar al Panel
            </button>
        </form>
    </div>

    <script>
        if (localStorage.getItem('tema') === 'oscuro') {
            document.documentElement.classList.add('dark');
        }
    </script>
</body>
</html>
