<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <title>Editar Posteo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', }</script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-200 transition-colors duration-300 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-lg border border-slate-100 dark:border-slate-700 w-full max-w-md">
        <h3 class="text-2xl font-bold mb-6 text-slate-700 dark:text-slate-100">Editar Publicación</h3>
        
        <!-- Agregamos el enctype acá también -->
        <form method="POST" action="" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="space-y-4">
                <div><label class="block text-sm font-bold text-slate-600 dark:text-slate-300">Red Social</label>{{ form.red_social }}</div>
                <div><label class="block text-sm font-bold text-slate-600 dark:text-slate-300">Fecha y Hora</label>{{ form.fecha_publicacion }}</div>
                <div><label class="block text-sm font-bold text-slate-600 dark:text-slate-300">Estado</label>{{ form.estado }}</div>
                <div>
                    <label class="block text-sm font-bold text-slate-600 dark:text-slate-300 mb-1">Imagen Actual / Cambiar</label>
                    <div class="text-sm">{{ form.imagen }}</div>
                </div>
                <div><label class="block text-sm font-bold text-slate-600 dark:text-slate-300">Texto / Copy</label>{{ form.texto_posteo }}</div>
            </div>

            <div class="mt-8 flex gap-4">
                <a href="{% url 'detalle_cliente' post.cliente.id %}" class="flex-1 flex items-center justify-center bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300 font-bold py-3 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">Cancelar</a>
                <button type="submit" class="flex-1 bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition-colors shadow-lg">Actualizar</button>
            </div>
        </form>
    </div>

    <script>
        if (localStorage.getItem('tema') === 'oscuro') {
            document.documentElement.classList.add('dark');
        }
    </script>
</body>
</html>
